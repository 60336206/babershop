<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon">
        <i class="pi pi-shield"></i>
      </div>
      <h1>EPIIS</h1>
      <p>Sistema de Denuncias y Sugerencias<br>Universidad Nacional Micaela Bastidas de Apurímac</p>
    </div>

    @if (errorMessage) {
      <div class="error-msg">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="login-form">

      <div class="field">
        <label for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope"></i>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            placeholder="correo@unamba.edu.pe"
            (keydown.enter)="login()"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="pi pi-lock"></i>
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Ingresa tu contraseña"
            (keydown.enter)="login()"
            autocomplete="current-password"
          />
          <button class="toggle-password" type="button" (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </button>
        </div>
      </div>

      <button class="btn-login" (click)="login()" [disabled]="loading">
        @if (loading) {
          <i class="pi pi-spin pi-spinner"></i>
          <span>Verificando...</span>
        } @else {
          <i class="pi pi-sign-in"></i>
          <span>Iniciar sesión</span>
        }
      </button>

    </div>

    <div class="login-footer">
      © 2026 EPIIS - UNAMBA · Todos los derechos reservados
    </div>
  </div>
</div>
